<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46e07c"/>
      <stop offset="1" stop-color="#169e46"/>
    </linearGradient>
    <mask id="gap">
      <rect width="16" height="16" fill="#fff"/>
      <rect x="5.4" y="4.4" width="9.2" height="10.2" rx="2.3" fill="#000" stroke="#000" stroke-width="2.8"/>
    </mask>
    <mask id="cut">
      <rect width="16" height="16" fill="#fff"/>
      <polyline points="7.7,9.7 9.4,11.4 12.4,8" fill="none" stroke="#000" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22.5" fill="url(#bg)"/>
  <g transform="translate(18 18) scale(4)" fill="#fff">
    <rect x="1.6" y="1.4" width="8.6" height="10.2" rx="2.2" fill="none" stroke="#fff" stroke-width="1.45" mask="url(#gap)"/>
    <rect x="5.4" y="4.4" width="9.2" height="10.2" rx="2.3" mask="url(#cut)"/>
  </g>
</svg>
